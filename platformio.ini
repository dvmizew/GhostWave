[platformio]
default_envs = ghostwave

[env:ghostwave]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
build_flags = 
	-D CORE_DEBUG_LEVEL=0
	-O2
	-g
	-I src
build_src_flags = 
	-Wall
	-Wextra
lib_deps = 
	h2zero/NimBLE-Arduino @ ^2.2.3
